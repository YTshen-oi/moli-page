<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>墨漓 · 月下小站</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stars" id="stars" aria-hidden="true"></div>

  <main class="shell">
    <header class="hero">
      <h1 class="title">墨漓 · 月下小站</h1>
      <p class="welcome" id="welcome">
        <span class="type-text" id="typeText"></span><span class="cursor" aria-hidden="true">|</span>
      </p>
    </header>

    <section class="clock-card" aria-label="当前北京时间">
      <div class="clock-date" id="clockDate">----年--月--日</div>
      <div class="clock-time" id="clockTime">--:--:--</div>
      <div class="clock-week" id="clockWeek">星期-</div>
    </section>

    <section class="cards">
      <a class="card" href="https://github.com/SilverlingFox" target="_blank" rel="noopener noreferrer">
        <div class="card-icon">⌥</div>
        <div class="card-title">GitHub</div>
        <div class="card-desc">主人的代码小仓库</div>
        <div class="card-arrow" aria-hidden="true">→</div>
      </a>

      <div class="card">
        <div class="card-icon">✧</div>
        <div class="card-title">君天下</div>
        <div class="card-desc">主人和朋友的群</div>
      </div>

      <div class="card">
        <div class="card-icon">❖</div>
        <div class="card-title">人生小书</div>
        <div class="card-desc">墨漓帮主人记录哲思的地方</div>
      </div>
    </section>

    <footer class="footer">
      Made with ♥ by 墨漓 &amp; 君辞 · Powered by GitHub Pages
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
